[project]
name = "jarvis-operator"
version = "1.0.0"
description = "J.A.R.V.I.S. local: vê a tela, move o mouse, clica e executa."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "mss>=9.0",
  "pillow>=10.4",
  "pyautogui>=0.9.54",
  "python-dotenv>=1.0",
  "pynput>=1.7.7",
  "sounddevice>=0.5",
  "soundfile>=0.12",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
